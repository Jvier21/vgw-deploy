- job_name: "vgw-dev"
  scrape_interval: 1s
  static_configs:
    - targets: ['172.16.220.51:9080']
  metrics_path: '/metrics'
  scheme: 'http'
  # If you are using HTTPS, replace 'http' with 'https'
  # and provide the TLS configuration
  # scheme: 'https'
  # tls_config:
  #   insecure_skip_verify: true

